# pytest configuration for plant monitoring system

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    contract: Contract tests for external APIs (ntfy.sh)
    integration: Integration tests for cross-component workflows
    unit: Unit tests for individual components

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Minimum Python version
minversion = 3.9
